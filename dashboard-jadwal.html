<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Jadwal Kapal - GoTrans SCM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Library Sakti untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%); 
            padding: 30px 15px; 
            color: #334155; 
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 1300px; 
            margin: auto; 
            background: #ffffff; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08); 
            border-top: 6px solid #f97316; 
        }
        
        .header-area {
            text-align: center;
            margin-bottom: 30px; 
        }
        h1 { color: #0f172a; margin: 0 0 5px 0; font-weight: 700; letter-spacing: -0.5px; }
        .last-update { font-size: 13px; color: #64748b; font-style: italic; }
        
        .controls-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; padding: 15px 20px; border-radius: 10px; border: 1px solid #e2e8f0;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }
        
        .filter-section { display: flex; gap: 15px; align-items: center; flex-wrap: wrap;}
        .filter-box { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;}
        .filter-box input, .filter-box select {
            padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1;
            font-family: 'Poppins', sans-serif; font-size: 13px; outline: none;
        }
        .filter-box input:focus, .filter-box select:focus { border-color: #f97316; }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            padding: 9px 16px; border-radius: 6px; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s; border: none; text-decoration: none;
            display: flex; align-items: center; gap: 5px; font-family: 'Poppins', sans-serif;
        }
        .btn-excel { background-color: #10b981; color: white; }
        .btn-excel:hover { background-color: #059669; transform: translateY(-1px); }
        .btn-lacak { background-color: #0f172a; color: white; }
        .btn-lacak:hover { background-color: #1e293b; transform: translateY(-1px); }

        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; }
        th { 
            background-color: #1e293b; color: white; text-transform: uppercase; 
            font-size: 12px; letter-spacing: 0.5px; padding: 14px 15px; text-align: left;
        }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        tr:hover td { background-color: #f8fafc; }
        
        .vessel-name { font-weight: 700; color: #0f172a; display: block; }
        .route-name { font-size: 11px; color: #64748b; font-weight: 400; }
        
        #loadingMsg { text-align: center; padding: 30px; color: #64748b; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h1>Jadwal Kapal Pelayaran</h1>
        <div class="last-update" id="waktuUpdate">Terakhir diperbarui: Sedang menarik data...</div>
    </div>

    <div class="controls-wrapper">
        <div class="filter-section">
            <div class="filter-box">
                📍 Rute Tujuan:
                <input type="text" id="inputRute" placeholder="Ketik rute..." onkeyup="filterTabel()">
            </div>
            <div class="filter-box">
                🚢 Pelayaran:
                <select id="selectPelayaran" onchange="filterTabel()">
                    <option value="">Semua Pelayaran</option>
                    <option value="SPIL">SPIL</option>
                    <option value="TANTO">TANTO</option>
                    <option value="MERATUS">MERATUS</option>
                </select>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-excel" onclick="exportKeExcel()">📊 Export Excel</button>
            <a href="lacak-kapal.html" class="btn btn-lacak">🌐 Lacak Kapal (Live)</a>
        </div>
    </div>

    <div class="table-container">
        <table id="tableJadwal">
            <thead>
                <tr>
                    <th>PELAYARAN</th>
                    <th>VESSEL VOYAGE</th>
                    <th>OPEN STACK</th>
                    <th>CLOSING TIME</th>
                    <th>ESTIMATED TIME DEPARTURE</th>
                    <th>ESTIMATED TIME ARRIVAL</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data jadwal masuk ke sini lewat Javascript -->
            </tbody>
        </table>
        <div id="loadingMsg">⚙️ Menarik data jadwal terbaru...</div>
    </div>
</div>

<script>
    let dataJadwalGlobal = [];

    // Fungsi narik data JSON dari GitHub
    async function muatData() {
        try {
            // Pakai time() biar nggak nyangkut di cache browser
            const response = await fetch('jadwal.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error("Gagal mengambil data");
            
            dataJadwalGlobal = await response.json();
            
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('waktuUpdate').innerText = "Terakhir diperbarui: Hari ini (Live dari GitHub Actions)";
            
            tampilkanData(dataJadwalGlobal);
        } catch (error) {
            document.getElementById('loadingMsg').innerText = "❌ Gagal memuat data. Pastikan bot scraper GitHub sudah berjalan sukses.";
        }
    }

    // Fungsi nyetak data ke dalam tabel HTML
    function tampilkanData(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; // Bersihkan tabel dulu

        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Jadwal tidak ditemukan / Rute kosong</td></tr>';
            return;
        }

        data.forEach(item => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.pelayaran || 'SPIL'}</strong></td>
                <td>
                    <span class="vessel-name">${item.nama_kapal || '-'}</span>
                    <span class="route-name">${item.rute || '-'}</span>
                </td>
                <td>${formatTanggal(item.open_stack)}</td>
                <td>${formatTanggal(item.closing)}</td>
                <td>${formatTanggal(item.etd)}</td>
                <td>${formatTanggal(item.eta)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Fungsi Filter Rute & Pelayaran
    function filterTabel() {
        let inputRute = document.getElementById('inputRute').value.toLowerCase();
        let inputPelayaran = document.getElementById('selectPelayaran').value.toLowerCase();

        let dataTersaring = dataJadwalGlobal.filter(item => {
            let cocokRute = (item.rute || '').toLowerCase().includes(inputRute);
            let cocokPelayaran = inputPelayaran === "" || (item.pelayaran || '').toLowerCase().includes(inputPelayaran);
            
            return cocokRute && cocokPelayaran;
        });

        tampilkanData(dataTersaring);
    }

    // Fungsi Sakti Export Excel
    function exportKeExcel() {
        let tabel = document.getElementById("tableJadwal");
        // Convert tabel HTML jadi format buku kerja Excel (Workbook)
        let wb = XLSX.utils.table_to_book(tabel, {sheet: "Jadwal Kapal SCM"});
        
        // Bikin nama file otomatis tanggal hari ini
        let tgl = new Date().toISOString().slice(0,10);
        let namaFile = "Rekap_Jadwal_GoTrans_" + tgl + ".xlsx";
        
        // Trigger download
        XLSX.writeFile(wb, namaFile);
    }

    // Pembersih teks tanggal biar rapi di tabel
    function formatTanggal(str) {
        if (!str || str === "N/A" || str === "") return '-';
        return str.replace("Reefer", "").trim();
    }

    // Panggil fungsi saat web dibuka
    window.onload = muatData;
</script>
</body>
</html>
