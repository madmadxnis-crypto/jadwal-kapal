<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kapal Pelayaran - GoTrans SCM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%); 
            padding: 30px 15px; 
            color: #334155; 
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 1400px; 
            margin: auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08); 
            border-top: 6px solid #f97316; 
        }
        
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-height: 85px; width: auto; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
        
        h2 { text-align: center; color: #0f172a; margin-bottom: 5px; margin-top: 5px; font-weight: 700; letter-spacing: -0.5px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 20px; font-size: 13px; font-weight: 400; }
        
        /* Toolbar Grid System untuk nampung banyak filter */
        .toolbar { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
            background: #f8fafc; padding: 16px 20px; border-radius: 10px; 
            border: 1px solid #e2e8f0; margin-bottom: 20px; align-items: end;
        }
        .filter-item { display: flex; flex-direction: column; gap: 6px; }
        .toolbar label { font-weight: 600; color: #334155; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        input[type="text"], input[type="date"], select { 
            padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; 
            font-family: 'Poppins', sans-serif; font-weight: 600; color: #0f172a; font-size: 13px;
            background-color: white; outline: none; cursor: pointer; transition: all 0.2s; width: 100%; box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }

        .action-buttons { display: flex; gap: 10px; grid-column: 1 / -1; justify-content: flex-end; margin-top: 5px;}
        
        .btn-refresh { 
            background-color: #f97316; color: white; border: none; 
            padding: 9px 16px; cursor: pointer; border-radius: 6px; 
            font-weight: 600; font-family: 'Poppins', sans-serif; font-size: 13px; text-decoration: none;
            transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(249, 115, 22, 0.2);
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-refresh:hover { background-color: #ea580c; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(249, 115, 22, 0.3); }
        .btn-refresh:active { transform: translateY(0); }
        
        .btn-lacak { background-color: #0f172a; box-shadow: 0 4px 6px rgba(15, 23, 42, 0.2); }
        .btn-lacak:hover { background-color: #1e293b; box-shadow: 0 6px 12px rgba(15, 23, 42, 0.3); }
        .btn-excel { background-color: #10b981; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); }
        .btn-excel:hover { background-color: #059669; box-shadow: 0 6px 12px rgba(16, 185, 129, 0.3); }

        /* TABEL STICKY HEADER & SCROLL */
        .table-responsive { max-height: 650px; overflow-y: auto; overflow-x: auto; border-radius: 8px; box-shadow: 0 0 0 1px #e2e8f0; position: relative;}
        table { width: 100%; border-collapse: collapse; } 
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 12px; } 
        th { 
            background-color: #0f172a; color: #f8fafc; text-transform: uppercase; font-size: 11px; 
            font-weight: 700; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 10; cursor: pointer;
            transition: background-color 0.2s;
        }
        th:hover { background-color: #1e293b; }
        tr { transition: background-color 0.2s ease; }
        tr:hover { background-color: #f1f5f9; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; display: inline-block;}
        .badge-fastest { background-color: #22c55e; color: white; margin-top: 4px; box-shadow: 0 2px 4px rgba(34, 197, 94, 0.2); display: block; width: fit-content;}
        .badge-rute { background-color: #cbd5e1; color: #334155; }
        
        /* ALERT CLOSING TIME */
        .closing-danger { color: #dc2626; font-weight: bold; background: #fee2e2; padding: 2px 6px; border-radius: 4px; display: inline-block;}
        .closing-warning { color: #d97706; font-weight: bold; background: #fef3c7; padding: 2px 6px; border-radius: 4px; display: inline-block;}

        /* Warna Pelayaran & Vendor */
        .badge-spil { background-color: #eab308; color: #ffffff; }
        .badge-temas { background-color: #06b6d4; color: white; }
        .badge-meratus { background-color: #1e3a8a; color: white; }
        .badge-tanto { background-color: #334155; color: white; }
        .badge-icon { background-color: #f97316; color: white; }
        .badge-samudera { background-color: #dc2626; color: white; }

        .badge-vendor-apu { background-color: #8b5cf6; color: white; border: 1px solid #7c3aed; } 
        .badge-vendor-tar { background-color: #14b8a6; color: white; border: 1px solid #0d9488; } 
        .badge-vendor-ire { background-color: #ec4899; color: white; border: 1px solid #db2777; } 
        .badge-vendor-lsj { background-color: #3b82f6; color: white; border: 1px solid #2563eb; } 
        .badge-vendor-aar { background-color: #f97316; color: white; border: 1px solid #ea580c; } 
        .badge-vendor-bjl { background-color: #22c55e; color: white; border: 1px solid #16a34a; } 
        .badge-vendor-rmb { background-color: #ef4444; color: white; border: 1px solid #dc2626; } 
        .badge-vendor-tpl { background-color: #eab308; color: white; border: 1px solid #ca8a04; } 
        .badge-vendor-hst { background-color: #6366f1; color: white; border: 1px solid #4f46e5; } 
        .badge-vendor-bal { background-color: #06b6d4; color: white; border: 1px solid #0891b2; } 
        .badge-vendor-pat { background-color: #84cc16; color: white; border: 1px solid #65a30d; } 
        .badge-vendor-sbt { background-color: #f43f5e; color: white; border: 1px solid #e11d48; } 
        .badge-vendor-dff { background-color: #f59e0b; color: white; border: 1px solid #d97706; } 
        .badge-vendor-default { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; } 
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo%20gobel.jpg" alt="Logo GoTrans Gobel">
    </div>
    
    <h2>Dashboard Master Jadwal Kapal</h2>
    <p class="subtitle" id="lastUpdated">Terakhir diperbarui: -</p>

    <div class="toolbar">
        <div class="filter-item">
            <label for="routeFilter">📍 Rute Tujuan</label>
            <input type="text" id="routeFilter" list="ruteOptions" oninput="tampilkanTabel()" placeholder="Ketik rute..." autocomplete="off">
            <datalist id="ruteOptions">
                <option value="Semua Rute">
                <option value="Makassar">
                <option value="Bitung (Manado)">
                <option value="Gorontalo">
                <option value="Samarinda">
                <option value="Balikpapan">
                <option value="Banjarmasin">
                <option value="Belawan (Medan)">
                <option value="Palu (Tangkian)">
                <option value="Batam">
                <option value="Pontianak">
                <option value="Tanjung Pinang">
            </datalist>
        </div>
        
        <div class="filter-item">
            <label for="pelayaranFilter">🚢 Pelayaran</label>
            <select id="pelayaranFilter" onchange="tampilkanTabel()">
                <option value="ALL">Semua Pelayaran</option>
                <option value="SPIL">SPIL</option>
                <option value="TEMAS">TEMAS</option>
                <option value="MERATUS">MERATUS</option>
                <option value="TANTO">TANTO</option>
                <option value="ICON">ICON</option>
                <option value="SAMUDERA">SAMUDERA</option>
            </select>
        </div>

        <div class="filter-item">
            <label for="searchVessel">🔍 Cari Nama Kapal</label>
            <input type="text" id="searchVessel" oninput="tampilkanTabel()" placeholder="Misal: Sinar Sanur...">
        </div>

        <div class="filter-item" style="grid-column: span 2; display: flex; flex-direction: row; align-items: end; gap: 10px;">
            <div style="flex: 1;">
                <label>📅 ETD Mulai</label>
                <input type="date" id="startDate" onchange="tampilkanTabel()">
            </div>
            <div style="padding-bottom: 8px; font-weight: 600; color: #64748b;">s/d</div>
            <div style="flex: 1;">
                <label>ETD Sampai</label>
                <input type="date" id="endDate" onchange="tampilkanTabel()">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-refresh btn-excel" onclick="exportKeExcel()">📊 Export Excel</button>
            <a href="lacak-kapal.html" class="btn-refresh btn-lacak">🌐 Lacak Kapal (Live Map)</a>
            <button class="btn-refresh" onclick="tarikSemuaData()">🔄 Refresh Data</button>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th onclick="sortTable('pelayaran')" title="Klik untuk mengurutkan">Pelayaran ↕️</th>
                    <th>Suggest Vendor</th> 
                    <th onclick="sortTable('nama_kapal')" title="Klik untuk mengurutkan">Vessel Voyage ↕️</th>
                    <th>Open Stack</th>
                    <th onclick="sortTable('closing')" title="Klik untuk mengurutkan">Closing Time ↕️</th>
                    <th onclick="sortTable('etd')" title="Klik untuk mengurutkan">ETD ↕️</th> 
                    <th onclick="sortTable('eta')" title="Klik untuk mengurutkan">ETA ↕️</th> 
                    <th>ETB</th> 
                    <th onclick="sortTable('rute')" title="Klik untuk mengurutkan">Rute ↕️</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="9" style="text-align: center; padding: 30px; font-weight: 600; color: #94a3b8;">⚙️ Menarik data jadwal & trend terbaru...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let dataJadwalGlobal = [];
    let dataTrendGlobal = null; 
    let currentSort = { column: 'etd', asc: true }; // Default urut berdasar ETD tercepat

    function parseKeTanggal(dateStr) {
        if (!dateStr || dateStr === "N/A") return 9999999999999;
        try {
            let cleanStr = dateStr.split('Reefer')[0].trim();
            if (cleanStr.includes(',')) {
                let textDate = cleanStr.split(',')[1].trim(); 
                let parts = textDate.split(' ');
                let dictBulan = {"Januari":"01", "Februari":"02", "Maret":"03", "April":"04", "Mei":"05", "Juni":"06", "Juli":"07", "Agustus":"08", "September":"09", "Oktober":"10", "November":"11", "Desember":"12"};
                let m = dictBulan[parts[1]] || "01";
                return new Date(`${parts[2]}-${m}-${parts[0]}T${parts[3] || '00:00'}`).getTime();
            }
            if (cleanStr.includes('/')) {
                let parts = cleanStr.split(' ');
                let dParts = parts[0].split('/');
                let time = parts[1] || '00:00';
                return new Date(`${dParts[2]}-${dParts[1]}-${dParts[0]}T${time}`).getTime();
            } else {
                let safeStr = cleanStr.replace("Mei", "May").replace("Agt", "Aug").replace("Okt", "Oct").replace("Des", "Dec");
                let d = new Date(safeStr);
                if (!isNaN(d.getTime())) return d.getTime();
            }
        } catch(e) {}
        return 9999999999999;
    }

    function formatTanggalStandar(dateStr) {
        if (!dateStr || dateStr === "N/A" || dateStr === "") return '<span style="color:#cbd5e1;">N/A</span>';
        let cleanStr = dateStr.split('Reefer')[0].trim();
        if (cleanStr.includes(',')) {
            let parts = cleanStr.split(',')[1].trim().split(' ');
            if (parts.length >= 3) return `${parts[0]} ${parts[1].substring(0,3)} ${parts[2]}`;
        }
        if (cleanStr.includes('/')) {
            let parts = cleanStr.split(' ')[0].split('/'); 
            if (parts.length === 3) {
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                let m = parseInt(parts[1]) - 1;
                return `${parts[0]} ${months[m]} ${parts[2]}`; 
            }
            return cleanStr.split(' ')[0]; 
        }
        let parts = cleanStr.split(' ');
        if (parts.length >= 3) return `${parts[0]} ${parts[1]} ${parts[2]}`; 
        return cleanStr;
    }

    async function tarikSemuaData() {
        try {
            const resTrend = await fetch('trend_vendor_rute.json?v=' + new Date().getTime());
            if (resTrend.ok) {
                dataTrendGlobal = await resTrend.json();
            }
        } catch (e) { console.log("File Trend gagal diload."); }

        try {
            const response = await fetch('jadwal.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error("Gagal mengambil file JSON.");
            
            let rawData = await response.json();
            if (!Array.isArray(rawData)) throw new Error("Format JSON bukan Array.");
            
            let hariIni = new Date();
            hariIni.setHours(0, 0, 0, 0); 
            let waktuHariIni = hariIni.getTime();

            dataJadwalGlobal = rawData.filter(item => {
                if (!item || !item.rute) return false;
                
                if (item.rute.toUpperCase() === "MEDAN") item.rute = "Belawan";
                if (item.rute.toUpperCase() === "MANADO") item.rute = "Bitung";
                
                let waktuETD = parseKeTanggal(item.etd);
                return waktuETD >= waktuHariIni; 
            });
            
            document.getElementById('lastUpdated').innerText = `Diperbarui otomatis: ${new Date().toLocaleString('id-ID')}`;
            tampilkanTabel();
        } catch (error) {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 30px; color: #ef4444; font-weight: 600;">❌ Gagal Memuat Data Jadwal: Cek file jadwal.json</td></tr>`;
        }
    }

    function getVendorBadgesHTML(ruteTujuan, pelayaran) {
        if (!dataTrendGlobal) return '<span style="color:#cbd5e1; font-size:11px;">-</span>';

        let listVendor = [];
        try {
            let ruteDicari = (ruteTujuan || "").toLowerCase();
            if (ruteDicari.includes("bitung")) ruteDicari = "manado";
            if (ruteDicari.includes("belawan")) ruteDicari = "medan";
            
            let matchedRouteKey = Object.keys(dataTrendGlobal).find(k => {
                let kLower = k.toLowerCase();
                return kLower.includes(ruteDicari) || ruteDicari.includes(kLower);
            });

            if (matchedRouteKey) {
                let vendorsDiRute = dataTrendGlobal[matchedRouteKey]; 
                let pelayaranDicari = pelayaran.toUpperCase().trim();
                let rankingVendor = [];

                for (let namaVendor in vendorsDiRute) {
                    let dataPelayaran = vendorsDiRute[namaVendor];
                    let totalPake = 0;
                    
                    for (let namaLine in dataPelayaran) {
                        if (namaLine.toUpperCase().includes(pelayaranDicari) || pelayaranDicari.includes(namaLine.toUpperCase())) {
                            totalPake += dataPelayaran[namaLine]; 
                        }
                    }
                    if (totalPake > 0) rankingVendor.push({ vendor: namaVendor, skor: totalPake });
                }
                rankingVendor.sort((a, b) => b.skor - a.skor);
                listVendor = rankingVendor.slice(0, 3).map(v => v.vendor);
            }
        } catch(e) { }

        if (listVendor.length === 0) return '<span style="color:#cbd5e1; font-size:11px;">-</span>';

        let badgesHTML = '';
        listVendor.forEach(v => {
            let namaClass = 'badge-vendor-default';
            let vClean = String(v).toUpperCase().trim();
            
            if (vClean === 'APU') namaClass = 'badge-vendor-apu';
            else if (vClean === 'TAR') namaClass = 'badge-vendor-tar';
            else if (vClean === 'IRE') namaClass = 'badge-vendor-ire';
            else if (vClean === 'LSJ') namaClass = 'badge-vendor-lsj';
            else if (vClean === 'AAR') namaClass = 'badge-vendor-aar';
            else if (vClean === 'BJL') namaClass = 'badge-vendor-bjl';
            else if (vClean === 'RMB') namaClass = 'badge-vendor-rmb';
            else if (vClean === 'TPL') namaClass = 'badge-vendor-tpl';
            else if (vClean === 'HST') namaClass = 'badge-vendor-hst';
            else if (vClean === 'BAL') namaClass = 'badge-vendor-bal';
            else if (vClean === 'PAT') namaClass = 'badge-vendor-pat';
            else if (vClean === 'SBT') namaClass = 'badge-vendor-sbt';
            else if (vClean === 'DFF') namaClass = 'badge-vendor-dff';
            
            badgesHTML += `<span class="badge ${namaClass}" style="margin-right: 2px; margin-bottom: 2px;" title="Top Vendor">${vClean}</span>`;
        });
        return badgesHTML;
    }

    function ruteCocok(ruteJSON, filterPilihan) {
        let r = (ruteJSON || "").toLowerCase();
        let f = filterPilihan.toLowerCase().trim().split(' ')[0]; 
        if (f === "all" || f === "semua" || f === "") return true;
        
        let aliases = r;
        if (r.includes("belawan") || r.includes("medan")) aliases += " belawan medan";
        if (r.includes("palu") || r.includes("tangkian")) aliases += " palu tangkian";
        if (r.includes("bitung") || r.includes("manado")) aliases += " bitung manado";
        if (r.includes("tanjung pinang") || r.includes("kid")) aliases += " tanjung pinang kid";
        
        return aliases.includes(f);
    }

    // FUNGSI SORTING (URUTKAN)
    function sortTable(column) {
        if (currentSort.column === column) {
            currentSort.asc = !currentSort.asc;
        } else {
            currentSort.column = column;
            currentSort.asc = true;
        }
        tampilkanTabel();
    }

    function tampilkanTabel() {
        const filterRute = document.getElementById('routeFilter').value;
        const filterPelayaran = document.getElementById('pelayaranFilter').value;
        const searchVal = document.getElementById('searchVessel').value.toLowerCase();
        
        // Setup Date Range
        const startVal = document.getElementById('startDate').value;
        const endVal = document.getElementById('endDate').value;
        let startMs = startVal ? new Date(startVal).setHours(0,0,0,0) : 0;
        let endMs = endVal ? new Date(endVal).setHours(23,59,59,999) : 9999999999999;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        // 1. FILTER UMUM (Rute, Pelayaran, Tanggal, dan Global Search Nama Kapal)
        let disaringAwal = dataJadwalGlobal.filter(item => {
            let matchRute = ruteCocok(item.rute, filterRute);
            let matchPelayaran = (filterPelayaran === "ALL") ? true : ((item.pelayaran || "").toUpperCase() === filterPelayaran);
            
            // Search Kapal
            let kapalNama = (item.nama_kapal || "").toLowerCase();
            let matchSearch = kapalNama.includes(searchVal);

            // Filter Tanggal ETD
            let waktuETD = parseKeTanggal(item.etd);
            let matchDate = (waktuETD >= startMs && waktuETD <= endMs);

            return matchRute && matchPelayaran && matchSearch && matchDate;
        });

        // 2. LOGIKA PEMUSNAH SPAM SAMUDERA
        let disaringFinal = [];
        let trackerSamudera = {}; 

        disaringAwal.forEach(item => {
            let line = item.pelayaran ? item.pelayaran.toUpperCase() : "SPIL";
            if (line === "SAMUDERA") {
                let namaKapal = item.nama_kapal || "";
                let kapalPertama = namaKapal.split('->')[0].trim();
                let waktuKeberangkatan = parseKeTanggal(item.etd);

                if (!trackerSamudera[kapalPertama]) {
                    trackerSamudera[kapalPertama] = item;
                } else {
                    let waktuYangKecatet = parseKeTanggal(trackerSamudera[kapalPertama].etd);
                    if (waktuKeberangkatan < waktuYangKecatet) {
                        trackerSamudera[kapalPertama] = item;
                    }
                }
            } else {
                disaringFinal.push(item);
            }
        });

        for (let key in trackerSamudera) disaringFinal.push(trackerSamudera[key]);

        // 3. LOGIKA SORTING DINAMIS
        disaringFinal.sort((a, b) => {
            let valA, valB;
            if (currentSort.column === 'etd') { valA = parseKeTanggal(a.etd); valB = parseKeTanggal(b.etd); }
            else if (currentSort.column === 'eta') { valA = parseKeTanggal(a.eta); valB = parseKeTanggal(b.eta); }
            else if (currentSort.column === 'closing') { valA = parseKeTanggal(a.closing); valB = parseKeTanggal(b.closing); }
            else if (currentSort.column === 'pelayaran') { valA = (a.pelayaran || "").toLowerCase(); valB = (b.pelayaran || "").toLowerCase(); }
            else if (currentSort.column === 'nama_kapal') { valA = (a.nama_kapal || "").toLowerCase(); valB = (b.nama_kapal || "").toLowerCase(); }
            else if (currentSort.column === 'rute') { valA = (a.rute || "").toLowerCase(); valB = (b.rute || "").toLowerCase(); }
            
            if (valA < valB) return currentSort.asc ? -1 : 1;
            if (valA > valB) return currentSort.asc ? 1 : -1;
            return 0;
        });

        if(disaringFinal.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 40px; color: #64748b; font-weight:500;">📭 Tidak ada jadwal kapal yang cocok dengan filter.</td></tr>`;
            return;
        }

        // Variable buat nandain waktu sekarang buat Alert
        const sekarangMs = new Date().getTime();

        disaringFinal.forEach((item, index) => {
            let badgeTercepat = (index === 0 && ruteCocok(item.rute, filterRute) && filterRute.toLowerCase() !== "semua rute" && filterRute !== "" && currentSort.column === 'etd' && currentSort.asc) ? '<span class="badge badge-fastest">TERCEPAT</span>' : '';
            
            let line = item.pelayaran ? item.pelayaran.toUpperCase() : "SPIL";
            let badgePelayaran = 'badge-rute';
            if (line === "SPIL") badgePelayaran = 'badge-spil';
            else if (line === "TEMAS") badgePelayaran = 'badge-temas';
            else if (line === "MERATUS") badgePelayaran = 'badge-meratus';
            else if (line === "TANTO") badgePelayaran = 'badge-tanto';
            else if (line === "ICON") badgePelayaran = 'badge-icon';
            else if (line === "SAMUDERA") badgePelayaran = 'badge-samudera';

            let mentahKapal = item.nama_kapal;
            let mentahClosing = item.closing || "N/A";
            
            if ((!mentahKapal || mentahKapal === "") && line === "SPIL" && mentahClosing.includes("IMO")) {
                mentahKapal = mentahClosing.split("IMO")[0].trim();
                mentahClosing = "N/A";
            }
            if (!mentahKapal || mentahKapal === "") mentahKapal = "Tanpa Nama Kapal";
            let namaKapalBersih = mentahKapal.replace("[TEMAS]", "").replace("[SPIL]", "").trim();
            
            // Format Tanggal
            let openStack = formatTanggalStandar(item.open_stack);
            let closingStr = formatTanggalStandar(mentahClosing);
            let etdStr = formatTanggalStandar(item.etd);
            let etaStr = formatTanggalStandar(item.eta);
            let etbStr = formatTanggalStandar(item.etb);

            // LOGIKA 1: CLOSING URGENCY ALERT 🚨
            let timeClosing = parseKeTanggal(mentahClosing);
            let finalClosingHTML = closingStr;
            if (timeClosing !== 9999999999999 && timeClosing > sekarangMs) {
                let sisaJam = (timeClosing - sekarangMs) / (1000 * 60 * 60);
                if (sisaJam <= 24) finalClosingHTML = `<span class="closing-danger" title="Kurang dari 24 Jam!">⏳ ${closingStr}</span>`;
                else if (sisaJam <= 48) finalClosingHTML = `<span class="closing-warning" title="Kurang dari 48 Jam!">⚠️ ${closingStr}</span>`;
            } else if (timeClosing !== 9999999999999 && timeClosing < sekarangMs) {
                finalClosingHTML = `<span class="closing-danger">❌ CLOSED</span>`;
            }

            // LOGIKA 2: LEAD TIME (Sailing Time) ⏱️
            let timeETD = parseKeTanggal(item.etd);
            let timeETA = parseKeTanggal(item.eta);
            let leadTimeHTML = "";
            if (timeETD < 9999999999999 && timeETA < 9999999999999 && timeETA >= timeETD) {
                let hariSailing = Math.ceil((timeETA - timeETD) / (1000 * 60 * 60 * 24));
                leadTimeHTML = `<br><span style="font-size: 10px; color: #10b981; font-weight: 700;">(± ${hariSailing} Hari)</span>`;
            }

            let ruteTampil = (item.rute || "").toUpperCase();
            if (ruteTampil === "MEDAN") ruteTampil = "BELAWAN"; 

            let suggestVendorHTML = getVendorBadgesHTML(item.rute, line);

            tbody.innerHTML += `<tr>
                <td><span class="badge ${badgePelayaran}">${line}</span></td>
                <td>${suggestVendorHTML}</td> 
                <td><strong style="color:#0f172a; line-height: 1.4;">${namaKapalBersih}</strong>${badgeTercepat}</td>
                <td>${openStack}</td>
                <td>${finalClosingHTML}</td>
                <td><strong style="color:#0f172a;">${etdStr}</strong></td>
                <td>${etaStr}${leadTimeHTML}</td>
                <td>${etbStr}</td>
                <td><span class="badge badge-rute">${ruteTampil}</span></td>
            </tr>`;
        });
    }

    function exportKeExcel() {
        let tabel = document.querySelector("table");
        let wb = XLSX.utils.table_to_book(tabel, {sheet: "Jadwal Kapal"});
        let tgl = new Date().toISOString().slice(0,10);
        let namaFile = "Rekap_Jadwal_GoTrans_" + tgl + ".xlsx";
        XLSX.writeFile(wb, namaFile);
    }

    window.onload = tarikSemuaData;
</script>
</body>
