name: Auto Scrape Jadwal Kapal GoTrans

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode proyek
      uses: actions/checkout@v4

    - name: Install Python & Selenium
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install selenium requests

    - name: Jalankan Scraper Sakti
      run: python run_all.py
- name: Simpan Data Terbaru ke Web
        run: |
          git config --global user.name 'GoTrans Bot'
          git config --global user.email 'bot@gotrans.com'
          git add .
          git commit -m "Automated update jadwal.json" || exit 0
          
          # Tambahin baris ini buat narik update terbaru sebelum nge-push
          git pull --rebase origin main
          
          git push origin main
